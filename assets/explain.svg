<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-label="A small robot labels a review positive, points at the words it says mattered, and its confidence drops when those words are deleted">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tok { fill: #E6FFFB; font-size: 18px; }
    .box { fill: #12403C; }
    .small { fill: #8FB9B3; font-size: 13px; }
    .say { fill: #0B2422; font-size: 15px; font-weight: 700; }
    * { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }

    .eyes { animation-name: scan; }
    @keyframes scan {
      0%, 4% { transform: translateX(-3px); }
      10% { transform: translateX(3px); }
      16% { transform: translateX(-3px); }
      22%, 100% { transform: translateX(2px); }
    }
    .blink { animation-name: blink; transform-box: fill-box; transform-origin: center; }
    @keyframes blink {
      0%, 46%, 50%, 86%, 90%, 100% { transform: scaleY(1); }
      48%, 88% { transform: scaleY(0.1); }
    }
    .antenna { animation-name: glow; }
    @keyframes glow {
      0%, 100% { fill: #5EB8AE; }
      50% { fill: #FDE68A; }
    }

    .bubble1 { animation-name: b1; opacity: 0; }
    @keyframes b1 { 0%, 12% { opacity: 0; } 15%, 28% { opacity: 1; } 31%, 100% { opacity: 0; } }
    .bubble2 { animation-name: b2; opacity: 0; }
    @keyframes b2 { 0%, 31% { opacity: 0; } 34%, 50% { opacity: 1; } 53%, 100% { opacity: 0; } }
    .bubble3 { animation-name: b3; opacity: 0; }
    @keyframes b3 { 0%, 53% { opacity: 0; } 56%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }

    .hl { animation-name: hl; opacity: 0; }
    @keyframes hl { 0%, 32% { opacity: 0; } 36%, 52% { opacity: 1; } 56%, 100% { opacity: 0; } }

    .gone { animation-name: gone; }
    @keyframes gone { 0%, 54% { opacity: 1; } 60%, 92% { opacity: 0.25; } 97%, 100% { opacity: 1; } }
    .strike { animation-name: strike; stroke-dasharray: 280; stroke-dashoffset: 280; }
    @keyframes strike { 0%, 54% { stroke-dashoffset: 280; } 60%, 92% { stroke-dashoffset: 0; } 97%, 100% { stroke-dashoffset: 280; } }

    .bar { animation-name: bar; transform-box: fill-box; transform-origin: left; transform: scaleX(0); }
    @keyframes bar {
      0%, 12% { transform: scaleX(0); }
      18%, 56% { transform: scaleX(0.96); }
      64%, 92% { transform: scaleX(0.31); }
      98%, 100% { transform: scaleX(0); }
    }
    .p1 { animation-name: p1; opacity: 0; }
    @keyframes p1 { 0%, 14% { opacity: 0; } 18%, 57% { opacity: 1; } 61%, 100% { opacity: 0; } }
    .p2 { animation-name: p2; opacity: 0; }
    @keyframes p2 { 0%, 61% { opacity: 0; } 65%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="818" height="228" rx="18" fill="#0B2422" stroke="#14B8A6" stroke-width="2"/>

  <!-- robot -->
  <g transform="translate(70 70)">
    <line x1="50" y1="0" x2="50" y2="-18" stroke="#5EB8AE" stroke-width="3"/>
    <circle class="antenna" cx="50" cy="-22" r="6"/>
    <rect x="0" y="0" width="100" height="78" rx="20" fill="#5EB8AE"/>
    <rect x="12" y="14" width="76" height="40" rx="12" fill="#0B2422"/>
    <g class="eyes">
      <g class="blink"><circle cx="35" cy="34" r="7" fill="#99F6E4"/><circle cx="65" cy="34" r="7" fill="#99F6E4"/></g>
    </g>
    <path d="M38 64 Q50 72 62 64" stroke="#0B2422" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="22" y="80" width="56" height="34" rx="10" fill="#5EB8AE"/>
    <circle cx="-4" cy="40" r="8" fill="#5EB8AE"/><circle cx="104" cy="40" r="8" fill="#5EB8AE"/>
  </g>

  <!-- speech bubbles -->
  <g transform="translate(190 22)">
    <g class="bubble1">
      <path d="M0 0 h150 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-140 l-14 12 l4 -12 a10 10 0 0 1 -10 -10 v-20 a10 10 0 0 1 10 -10z" fill="#99F6E4"/>
      <text class="say" x="16" y="26">positive! ✨</text>
    </g>
    <g class="bubble2">
      <path d="M0 0 h230 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-220 l-14 12 l4 -12 a10 10 0 0 1 -10 -10 v-20 a10 10 0 0 1 10 -10z" fill="#FDE68A"/>
      <text class="say" x="16" y="26">because of these words!</text>
    </g>
    <g class="bubble3">
      <path d="M0 0 h290 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-280 l-14 12 l4 -12 a10 10 0 0 1 -10 -10 v-20 a10 10 0 0 1 10 -10z" fill="#99F6E4"/>
      <text class="say" x="16" y="26">without them I'm unsure 🤔</text>
    </g>
  </g>

  <!-- review tokens -->
  <g transform="translate(0 100)">
    <rect class="box" x="250" y="0" width="52" height="34" rx="8"/><text class="tok" x="276" y="23" text-anchor="middle">the</text>
    <rect class="box" x="312" y="0" width="63" height="34" rx="8"/><text class="tok" x="343" y="23" text-anchor="middle">plot</text>
    <rect class="box" x="385" y="0" width="52" height="34" rx="8"/><text class="tok" x="411" y="23" text-anchor="middle">was</text>
    <g class="gone">
      <rect class="box" x="447" y="0" width="150" height="34" rx="8"/>
      <rect class="hl" x="447" y="0" width="150" height="34" rx="8" fill="#14B8A6" opacity="0"/>
      <text class="tok" x="522" y="23" text-anchor="middle">surprisingly</text>
      <rect class="box" x="607" y="0" width="117" height="34" rx="8"/>
      <rect class="hl" x="607" y="0" width="117" height="34" rx="8" fill="#14B8A6" opacity="0"/>
      <text class="tok" x="665" y="23" text-anchor="middle">wonderful</text>
    </g>
    <line class="strike" x1="447" y1="17" x2="724" y2="17" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- confidence bar -->
  <g transform="translate(250 168)">
    <text class="small" x="0" y="15">confidence</text>
    <rect x="100" y="2" width="330" height="18" rx="9" fill="#12403C"/>
    <rect class="bar" x="100" y="2" width="330" height="18" rx="9" fill="#14B8A6"/>
    <text class="small p1" x="442" y="15">96%</text>
    <text class="small p2" x="442" y="15">31%</text>
  </g>

  <text class="small" x="410" y="216" text-anchor="middle" opacity="0.8">delete the words a model says mattered: does its answer change?</text>
</svg>
