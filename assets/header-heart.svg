<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Robin Spreckley, Software Engineer. Explainable AI, tech for healthcare, biometrics.">
  <style>
    @font-face { font-family: 'Px'; src: url(data:font/truetype;base64,) format('truetype'); }
    text { font-family: 'Px', ui-monospace, monospace; text-anchor: middle; }
    .name { fill: #14B8A6; font-size: 40px; letter-spacing: 2px; opacity: 0; animation: pix 0.6s steps(4) 0.1s forwards; }
    .role { fill: #2BA597; font-size: 16px; letter-spacing: 3px; opacity: 0; animation: pix 0.4s steps(3) 0.8s forwards; }
    .tags { fill: #6FA9A1; font-size: 13px; letter-spacing: 1px; opacity: 0; animation: pix 0.4s steps(3) 2.4s forwards; }
    @keyframes pix { to { opacity: 1; } }
    .ecg { fill: none; stroke: #14B8A6; stroke-width: 4; stroke-linejoin: miter; stroke-linecap: square; shape-rendering: crispEdges;
           stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2s steps(28) 0.6s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .heart { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pix 0.1s 2.6s forwards, beat 1.2s steps(1) 2.7s infinite; }
    @keyframes beat { 0%, 30%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 45% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; } }
  </style>

  <text class="name" x="450" y="66">ROBIN SPRECKLEY</text>
  <text class="role" x="450" y="102">SOFTWARE ENGINEER</text>

  <polyline class="ecg" points="210,160 396,160 404,152 412,152 420,160 436,160 446,118 458,192 470,146 478,160 556,160 564,154 576,154 584,160 668,160"/>
  <g class="heart" fill="#F28AB2" shape-rendering="crispEdges">
    <rect x="680" y="150" width="6" height="6"/><rect x="692" y="150" width="6" height="6"/>
    <rect x="674" y="156" width="30" height="6"/>
    <rect x="680" y="162" width="18" height="6"/>
    <rect x="686" y="168" width="6" height="6"/>
  </g>

  <text class="tags" x="450" y="218">explainable AI · tech for healthcare · biometrics</text>
</svg>
